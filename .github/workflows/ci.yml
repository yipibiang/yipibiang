name: CI and Build Image

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]

jobs:
  # --- 阶段 1: 编译与测试 ---
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        # 编译并打包
        run: mvn clean package -DskipTests -f apps/services/user-service/pom.xml

      - name: Run tests
        # 单独运行测试（可选，如果测试失败这里会阻断流程）
        run: mvn test -f apps/services/user-service/pom.xml

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jar
          # 上传构建好的 jar 包
          path: apps/services/user-service/target/*.jar

  # --- 阶段 2: 构建 Docker 镜像 ---
  docker-build:
    needs: build # 依赖 build 任务成功
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # 只有 push 操作才构建镜像（PR 不构建）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: user-service-jar
          # 【关键】下载位置必须模拟出 target 目录结构
          # 因为 Dockerfile 里写的是 COPY target/*.jar
          path: apps/services/user-service/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          # Context 设为 user-service 目录，Dockerfile 的 COPY target/*.jar 才能正确匹配
          context: ./apps/services/user-service
          file: ./apps/services/user-service/deployments/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest