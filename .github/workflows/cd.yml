name: CD

on:
  workflow_run:
    workflows: ["CI and Build Image"] # 必须对应 CI 文件里的 name
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只有当 CI 成功 且 是 main 分支推送时才执行
    if: ${{
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 核心修改：不再构建，直接通知 ---
      
      - name: Trigger Deployment via Webhook
        run: |
          echo "🚀 CI 成功！开始触发部署..."
          
          # 获取触发 CI 的那个 Commit 的 SHA
          # 这样服务器就知道要拉取哪个版本的镜像 (user-service:SHA)
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          
          # 发送 Webhook
          # 注意：这里假设你的 Webhook 接收的是 SHA，然后服务器去拉取对应 SHA 的镜像
          curl -X POST "${{ secrets.WEBHOOK_URL }}/deploy" \
            -H "Content-Type: application/json" \
            -d "{
              \"service\": \"user-service\",
              \"image_tag\": \"${DEPLOY_SHA}\",
              \"ref\": \"${{ github.ref }}\"
            }" \
            --max-time 30
            
          echo "✅ 部署指令已发送！"